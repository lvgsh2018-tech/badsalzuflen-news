<body class="admin" hidden>

<header class="admin-bar">
  <a class="admin-brand" href="admin.html#uebersicht"><img src="assets/img/logo.webp" alt="Bad Salzuflen News"><span>Redaktion</span></a>
  <nav class="admin-tabs" aria-label="Bereiche">
    <a href="#uebersicht" data-tab="uebersicht">Übersicht</a>
    <a href="#beitraege" data-tab="beitraege">Beiträge</a>
    <a href="#termine" data-tab="termine">Termine</a>

  <div class="admin-actions">
    <a class="btn btn-primary btn-sm" href="#editor/neu">+ Neuer Beitrag</a>

  </div>
</header>

<main class="admin-main" id="view" tabindex="-1"></main>

<dialog id="dlg" class="dlg">

    <p id="dlgText"></p>

    <div class="dlg-actions">
      <button class="btn btn-secondary btn-sm" value="cancel" id="dlgNo">Abbrechen</button>
      <button class="btn btn-primary btn-sm" value="ok" id="dlgYes">OK</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
